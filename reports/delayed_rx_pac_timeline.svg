<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { fill: #1f2933; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .muted { fill: #617080; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .axis { stroke: #7b8794; stroke-width: 2; }
      .tick { stroke: #7b8794; stroke-width: 2; }
      .dash { stroke: #7b8794; stroke-width: 2; stroke-dasharray: 8 8; }
      .wave { fill: #8fc2ee; }
      .sfd { fill: #2f80d1; }
      .startup { fill: #f29aa0; }
      .pac { fill: #facb7a; }
      .pac2 { fill: #ffdca5; }
      .accum { fill: #c5e59a; }
      .listen { fill: #aab1b9; }
      .fail { fill: #d62828; }
      .ok { fill: #2f7d32; }
      .warn { fill: #b06b00; }
      .outline { fill: none; stroke: #b06b00; stroke-width: 3; stroke-dasharray: 8 6; }
      .thin { stroke: #c2c9d1; stroke-width: 1.5; }
      .callout { fill: #ffffff; stroke: #d8dee6; stroke-width: 2; rx: 14; }
      .badge { fill: #eef3f8; stroke: #c7d2de; stroke-width: 1.5; rx: 10; }
      .small { font-size: 22px; }
      .body { font-size: 25px; }
      .label { font-size: 28px; font-weight: 700; }
      .title { font-size: 42px; font-weight: 800; }
      .section { font-size: 31px; font-weight: 800; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1250"/>

  <text class="ink title" x="80" y="70">Delayed-RX 타이밍과 PAC 관점 해석</text>
  <text class="muted body" x="80" y="112">현재 코드 기준: t=0은 실제 preamble 시작, 32sym에서 preamble+SFD 실제 40.7us / 코드 계산 42us</text>

  <g transform="translate(80,145)">
    <rect class="wave" x="0" y="0" width="34" height="28" rx="5"/>
    <text class="ink body" x="48" y="23">전파: preamble</text>
    <rect class="sfd" x="270" y="0" width="34" height="28" rx="5"/>
    <text class="ink body" x="318" y="23">SFD</text>
    <rect class="startup" x="430" y="0" width="34" height="28" rx="5"/>
    <text class="ink body" x="478" y="23">RX 기동 지연 δ</text>
    <rect class="pac" x="690" y="0" width="34" height="28" rx="5"/>
    <text class="ink body" x="738" y="23">PAC8 상관 chunk</text>
    <rect class="accum" x="980" y="0" width="34" height="28" rx="5"/>
    <text class="ink body" x="1028" y="23">남은 preamble 누산 여유</text>
  </g>

  <!-- timeline axis: x(t) = 600 + 10*t -->
  <g transform="translate(0,0)">
    <line class="axis" x1="260" y1="220" x2="1570" y2="220"/>
    <g>
      <line class="tick" x1="300" y1="210" x2="300" y2="230"/>
      <text class="muted small mono" x="274" y="262">-30</text>
      <line class="tick" x1="400" y1="210" x2="400" y2="230"/>
      <text class="muted small mono" x="374" y="262">-20</text>
      <line class="tick" x1="500" y1="210" x2="500" y2="230"/>
      <text class="muted small mono" x="476" y="262">-10</text>
      <line class="tick" x1="600" y1="202" x2="600" y2="1220"/>
      <text class="ink small mono" x="588" y="262">0</text>
      <line class="tick" x1="700" y1="210" x2="700" y2="230"/>
      <text class="muted small mono" x="680" y="262">+10</text>
      <line class="tick" x1="800" y1="210" x2="800" y2="230"/>
      <text class="muted small mono" x="780" y="262">+20</text>
      <line class="tick" x1="900" y1="210" x2="900" y2="230"/>
      <text class="muted small mono" x="880" y="262">+30</text>
      <line class="tick" x1="1000" y1="210" x2="1000" y2="230"/>
      <text class="muted small mono" x="980" y="262">+40</text>
      <line class="tick" x1="1200" y1="210" x2="1200" y2="230"/>
      <text class="muted small mono" x="1180" y="262">+60</text>
      <line class="tick" x1="1400" y1="210" x2="1400" y2="230"/>
      <text class="muted small mono" x="1380" y="262">+80</text>
    </g>
    <line class="dash" x1="600" y1="202" x2="600" y2="1220"/>
    <text class="muted body" x="620" y="205">t=0: 실제 preamble 시작</text>
  </g>

  <!-- Case A -->
  <g transform="translate(0,295)">
    <text class="section ink" x="80" y="0">① 32sym, lead=0us</text>
    <text class="muted body" x="80" y="42">RX_ON 명령은 t=-1.3us지만 δ 후 실제 청취 시작</text>
    <text class="label ink" x="80" y="100">전파</text>
    <rect class="wave" x="600" y="72" width="326" height="56" rx="8"/>
    <rect class="sfd" x="926" y="72" width="81" height="56" rx="8"/>
    <text class="ink body" x="710" y="108">preamble 32sym (32.6us)</text>
    <text fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="800" x="947" y="108">SFD</text>
    <text class="label ink" x="80" y="188">수신기</text>
    <line class="thin" x1="587" y1="144" x2="587" y2="228"/>
    <text class="muted small mono" x="536" y="258">RX_ON cmd -1.3</text>
    <rect class="startup" x="587" y="158" width="150" height="56" rx="8"/>
    <text class="ink body" x="638" y="194">δ</text>
    <rect class="pac2" x="737" y="158" width="189" height="56" rx="8"/>
    <text class="ink body" x="760" y="194">관측 &lt; 21sym</text>
    <rect class="outline" x="926" y="158" width="66" height="56" rx="8"/>
    <text class="fail label" x="1160" y="118">✕ FWTO / PER 100%</text>
    <text class="fail body" x="1160" y="160">PAC 상관에 필요한 preamble 양이 부족</text>
    <text class="muted body" x="1160" y="198">프레임 시작까지 못 가므로 뒤쪽 tail은 도움 작음</text>
  </g>

  <!-- Case B -->
  <g transform="translate(0,535)">
    <text class="section ink" x="80" y="0">② 32sym, lead≈6us: 문턱 구간</text>
    <text class="muted body" x="80" y="42">실제 전단 여유 ≈ lead + 1.3 = 7.3us</text>
    <text class="label ink" x="80" y="100">전파</text>
    <rect class="wave" x="600" y="72" width="326" height="56" rx="8"/>
    <rect class="sfd" x="926" y="72" width="81" height="56" rx="8"/>
    <text class="ink body" x="710" y="108">preamble 32sym</text>
    <text fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="800" x="947" y="108">SFD</text>
    <text class="label ink" x="80" y="188">수신기</text>
    <line class="thin" x1="527" y1="144" x2="527" y2="228"/>
    <text class="muted small mono" x="474" y="258">cmd -7.3</text>
    <rect class="startup" x="527" y="158" width="150" height="56" rx="8"/>
    <text class="ink body" x="578" y="194">δ</text>
    <rect class="pac" x="677" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="758" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="839" y="158" width="81" height="56" rx="6"/>
    <text class="ink body" x="705" y="194">PAC8</text>
    <text class="ink body" x="786" y="194">PAC8</text>
    <text class="ink body" x="867" y="194">PAC8</text>
    <rect class="outline" x="920" y="158" width="84" height="56" rx="8"/>
    <text class="warn label" x="1160" y="112">△ SFDTO/FSL 발생 가능</text>
    <text class="warn body" x="1160" y="154">preamble은 잡기 시작하지만 SFD 경계 여유가 작음</text>
    <text class="muted body" x="1160" y="192">실험: lead 6us에서 PER 급락, sfdto/fsl 중심</text>
  </g>

  <!-- Case C -->
  <g transform="translate(0,775)">
    <text class="section ink" x="80" y="0">③ 32sym, lead=20us</text>
    <text class="muted body" x="80" y="42">현재 코드에서는 실제 전단 여유 ≈ 21.3us</text>
    <text class="label ink" x="80" y="100">전파</text>
    <rect class="wave" x="600" y="72" width="326" height="56" rx="8"/>
    <rect class="sfd" x="926" y="72" width="81" height="56" rx="8"/>
    <text class="ink body" x="710" y="108">preamble 32sym</text>
    <text fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="800" x="947" y="108">SFD</text>
    <text class="label ink" x="80" y="188">수신기</text>
    <line class="thin" x1="387" y1="144" x2="387" y2="228"/>
    <text class="muted small mono" x="334" y="258">cmd -21.3</text>
    <rect class="startup" x="387" y="158" width="150" height="56" rx="8"/>
    <text class="ink body" x="438" y="194">δ</text>
    <rect class="listen" x="537" y="158" width="63" height="56" rx="8"/>
    <text class="muted small" x="546" y="194">대기</text>
    <rect class="pac" x="600" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="681" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="762" y="158" width="81" height="56" rx="6"/>
    <text class="ink small" x="610" y="193">PAC8</text>
    <text class="ink small" x="691" y="193">PAC8</text>
    <text class="ink small" x="772" y="193">PAC8</text>
    <rect class="accum" x="843" y="158" width="83" height="56" rx="8"/>
    <text class="ink body" x="856" y="194">누산</text>
    <text class="ok label" x="1160" y="118">✓ 성공 영역</text>
    <text class="ok body" x="1160" y="160">기동이 preamble 도착 전에 끝나 PAC가 안정적으로 채워짐</text>
    <text class="muted body" x="1160" y="198">lead는 TX airtime을 늘리지 않는 RX-side guard</text>
  </g>

  <!-- Case D -->
  <g transform="translate(0,1015)">
    <text class="section ink" x="80" y="0">④ 64sym, lead=0us</text>
    <text class="muted body" x="80" y="42">프리앰블 자체가 길어 RX가 조금 늦게 들어도 acquisition 여유가 큼</text>
    <text class="label ink" x="80" y="100">전파</text>
    <rect class="wave" x="600" y="72" width="651" height="56" rx="8"/>
    <rect class="sfd" x="1251" y="72" width="81" height="56" rx="8"/>
    <text class="ink body" x="835" y="108">preamble 64sym (65.1us)</text>
    <text fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="27" font-weight="800" x="1271" y="108">SFD</text>
    <text class="label ink" x="80" y="188">수신기</text>
    <rect class="startup" x="583" y="158" width="150" height="56" rx="8"/>
    <text class="ink body" x="634" y="194">δ</text>
    <rect class="pac" x="733" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="814" y="158" width="81" height="56" rx="6"/>
    <rect class="pac" x="895" y="158" width="81" height="56" rx="6"/>
    <rect class="accum" x="976" y="158" width="275" height="56" rx="8"/>
    <text class="ink body" x="1008" y="194">남은 preamble 누산 여유 큼</text>
    <text class="ok label" x="1390" y="118">✓ PER 0%</text>
    <text class="ok body" x="1390" y="160">긴 preamble이 lead margin 역할도 수행</text>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(80,1165)">
    <rect class="callout" x="0" y="-18" width="1640" height="78"/>
    <text class="ink body" x="24" y="18">
      PAC8 = preamble을 8 symbol 단위 chunk로 상관/탐색하는 acquisition 단위. 약 21sym 관측이 필요하면 32sym은 앞부분 손실에 민감하고,
    </text>
    <text class="ink body" x="24" y="50">
      lead가 부족하면 FWTO, 문턱에서는 SFDTO/FSL, 충분하면 PHR/PSDU 단계의 드문 오류만 남는다.
    </text>
  </g>
</svg>
