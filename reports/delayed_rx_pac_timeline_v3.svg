<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { fill: #202933; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .muted { fill: #66778a; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .axis { stroke: #8a96a3; stroke-width: 2.2; }
      .tick { stroke: #8a96a3; stroke-width: 2.2; }
      .dash { stroke: #8a96a3; stroke-width: 2.2; stroke-dasharray: 8 8; }
      .thin { stroke: #c8d0d9; stroke-width: 1.8; }
      .wave { fill: #88bee9; }
      .sfd { fill: #2d7fd0; }
      .startup { fill: #f39aa3; }
      .listen { fill: #aeb7c0; }
      .pac { fill: #fac66d; }
      .accum { fill: #bee192; }
      .fail { fill: #d72f2f; }
      .ok { fill: #2f7d32; }
      .warn { fill: #b36b00; }
      .card { fill: #ffffff; stroke: #d8e0e8; stroke-width: 2; rx: 14; }
      .soft { fill: #eef3f8; stroke: #d5dee8; stroke-width: 2; rx: 16; }
      .outline { fill: none; stroke: #b36b00; stroke-width: 3; stroke-dasharray: 8 6; }
      .title { font-size: 39px; font-weight: 850; }
      .subtitle { font-size: 23px; font-weight: 500; }
      .section { font-size: 28px; font-weight: 850; }
      .label { font-size: 23px; font-weight: 800; }
      .body { font-size: 21px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .white { fill: #ffffff; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1500"/>

  <text class="ink title" x="70" y="64">Delayed-RX 실패 원인: PAC 관점 타이밍 해석</text>
  <text class="muted subtitle" x="70" y="102">현재 코드 기준: t=0은 실제 preamble 시작, 32sym 실제 preamble+SFD=40.7us / 코드 계산=42us</text>
  <text class="muted subtitle" x="70" y="134">따라서 32sym에서 실제 전단 여유 = lead + 1.3us</text>

  <!-- Legend -->
  <g transform="translate(70,170)">
    <rect class="wave" x="0" y="0" width="28" height="24" rx="5"/><text class="ink body" x="40" y="21">preamble</text>
    <rect class="sfd" x="190" y="0" width="28" height="24" rx="5"/><text class="ink body" x="230" y="21">SFD</text>
    <rect class="startup" x="340" y="0" width="28" height="24" rx="5"/><text class="ink body" x="380" y="21">기동 지연 δ</text>
    <rect class="pac" x="580" y="0" width="28" height="24" rx="5"/><text class="ink body" x="620" y="21">PAC8 상관 chunk</text>
    <rect class="accum" x="880" y="0" width="28" height="24" rx="5"/><text class="ink body" x="920" y="21">누산(accumCount)</text>
  </g>

  <!-- axis x = 520 + 7t -->
  <line class="axis" x1="250" y1="245" x2="1120" y2="245"/>
  <line class="dash" x1="520" y1="224" x2="520" y2="950"/>
  <text class="muted body" x="538" y="224">t=0: 실제 preamble 시작</text>
  <g class="mono">
    <line class="tick" x1="310" y1="234" x2="310" y2="256"/><text class="muted small" x="286" y="286">-30</text>
    <line class="tick" x1="380" y1="234" x2="380" y2="256"/><text class="muted small" x="356" y="286">-20</text>
    <line class="tick" x1="450" y1="234" x2="450" y2="256"/><text class="muted small" x="426" y="286">-10</text>
    <line class="tick" x1="520" y1="230" x2="520" y2="260"/><text class="ink small" x="514" y="286">0</text>
    <line class="tick" x1="590" y1="234" x2="590" y2="256"/><text class="muted small" x="572" y="286">+10</text>
    <line class="tick" x1="660" y1="234" x2="660" y2="256"/><text class="muted small" x="642" y="286">+20</text>
    <line class="tick" x1="730" y1="234" x2="730" y2="256"/><text class="muted small" x="712" y="286">+30</text>
    <line class="tick" x1="800" y1="234" x2="800" y2="256"/><text class="muted small" x="782" y="286">+40</text>
    <line class="tick" x1="940" y1="234" x2="940" y2="256"/><text class="muted small" x="922" y="286">+60</text>
    <line class="tick" x1="1080" y1="234" x2="1080" y2="256"/><text class="muted small" x="1062" y="286">+80</text>
  </g>

  <!-- Case 1 -->
  <g transform="translate(70,330)">
    <text class="section ink" x="0" y="0">① 32sym, lead=0us</text>
    <text class="muted body" x="0" y="34">RX_ON 명령 t=-1.3us, δ 후 실제 청취 시작 → PAC 관측량 부족</text>
    <text class="label ink" x="0" y="92">전파</text>
    <rect class="wave" x="450" y="62" width="228" height="45" rx="7"/>
    <rect class="sfd" x="678" y="62" width="57" height="45" rx="7"/>
    <text class="ink small" x="526" y="91">preamble 32sym</text>
    <text class="white small" x="695" y="91">SFD</text>
    <text class="label ink" x="0" y="158">수신기</text>
    <line class="thin" x1="441" y1="116" x2="441" y2="184"/>
    <text class="muted tiny mono" x="386" y="207">cmd -1.3</text>
    <rect class="startup" x="441" y="128" width="120" height="45" rx="7"/>
    <text class="ink body" x="494" y="157">δ</text>
    <rect class="pac" x="561" y="128" width="117" height="45" rx="7"/>
    <text class="ink small" x="579" y="157">관측 &lt; 21sym</text>
    <rect class="outline" x="678" y="128" width="52" height="45" rx="7"/>
    <rect class="card" x="970" y="56" width="460" height="128"/>
    <text class="fail section" x="995" y="93">✕ FWTO / PER 100%</text>
    <text class="ink body" x="995" y="128">프레임 시작까지 못 감</text>
    <text class="muted small" x="995" y="158">tail보다 앞쪽 acquisition 부족이 지배</text>
  </g>

  <!-- Case 2 -->
  <g transform="translate(70,555)">
    <text class="section ink" x="0" y="0">② 32sym, lead≈6us: 문턱 구간</text>
    <text class="muted body" x="0" y="34">실제 전단 여유 ≈ 7.3us. preamble은 잡기 시작하지만 SFD 경계가 불안정</text>
    <text class="label ink" x="0" y="92">전파</text>
    <rect class="wave" x="450" y="62" width="228" height="45" rx="7"/>
    <rect class="sfd" x="678" y="62" width="57" height="45" rx="7"/>
    <text class="ink small" x="526" y="91">preamble 32sym</text>
    <text class="white small" x="695" y="91">SFD</text>
    <text class="label ink" x="0" y="158">수신기</text>
    <line class="thin" x1="399" y1="116" x2="399" y2="184"/>
    <text class="muted tiny mono" x="348" y="207">cmd -7.3</text>
    <rect class="startup" x="399" y="128" width="120" height="45" rx="7"/>
    <text class="ink body" x="452" y="157">δ</text>
    <rect class="pac" x="519" y="128" width="56" height="45" rx="6"/>
    <rect class="pac" x="575" y="128" width="56" height="45" rx="6"/>
    <rect class="pac" x="631" y="128" width="56" height="45" rx="6"/>
    <text class="ink tiny" x="528" y="156">PAC8</text>
    <text class="ink tiny" x="584" y="156">PAC8</text>
    <text class="ink tiny" x="640" y="156">PAC8</text>
    <rect class="outline" x="687" y="128" width="52" height="45" rx="7"/>
    <rect class="card" x="970" y="56" width="460" height="128"/>
    <text class="warn section" x="995" y="93">△ SFDTO/FSL 중심</text>
    <text class="ink body" x="995" y="128">acquisition 이후 단계에서 탈락</text>
    <text class="muted small" x="995" y="158">실험: PER 4.0%, sfdto 34 / fsl 6</text>
  </g>

  <!-- Case 3 -->
  <g transform="translate(70,780)">
    <text class="section ink" x="0" y="0">③ 32sym, lead=20us</text>
    <text class="muted body" x="0" y="34">실제 전단 여유 ≈ 21.3us. δ가 끝난 뒤에도 preamble 관측 구간이 충분</text>
    <text class="label ink" x="0" y="92">전파</text>
    <rect class="wave" x="450" y="62" width="228" height="45" rx="7"/>
    <rect class="sfd" x="678" y="62" width="57" height="45" rx="7"/>
    <text class="ink small" x="526" y="91">preamble 32sym</text>
    <text class="white small" x="695" y="91">SFD</text>
    <text class="label ink" x="0" y="158">수신기</text>
    <line class="thin" x1="301" y1="116" x2="301" y2="184"/>
    <text class="muted tiny mono" x="246" y="207">cmd -21.3</text>
    <rect class="startup" x="301" y="128" width="120" height="45" rx="7"/>
    <text class="ink body" x="354" y="157">δ</text>
    <rect class="listen" x="421" y="128" width="29" height="45" rx="7"/>
    <text class="muted tiny" x="424" y="156">대기</text>
    <rect class="pac" x="450" y="128" width="56" height="45" rx="6"/>
    <rect class="pac" x="506" y="128" width="56" height="45" rx="6"/>
    <rect class="pac" x="562" y="128" width="56" height="45" rx="6"/>
    <text class="ink tiny" x="459" y="156">PAC8</text>
    <text class="ink tiny" x="515" y="156">PAC8</text>
    <text class="ink tiny" x="571" y="156">PAC8</text>
    <rect class="accum" x="618" y="128" width="60" height="45" rx="7"/>
    <text class="ink small" x="633" y="157">누산</text>
    <rect class="card" x="970" y="56" width="460" height="128"/>
    <text class="ok section" x="995" y="93">✓ 안정 성공 영역</text>
    <text class="ink body" x="995" y="128">기동 지연이 전단 여유 안에 흡수</text>
    <text class="muted small" x="995" y="158">TX airtime 증가 없이 RX-side guard 제공</text>
  </g>

  <!-- Lead sweep panel -->
  <g transform="translate(70,1030)">
    <rect class="soft" x="0" y="0" width="1460" height="330"/>
    <text class="section ink" x="25" y="48">Lead sweep 확대: 10 / 12 / 14 / 15us 포함</text>
    <text class="muted body" x="25" y="82">색은 실패 단계 변화를 의미. 12/14us는 안정 plateau 확인용 측정점으로 쓰기 좋음.</text>

    <line class="axis" x1="55" y1="142" x2="950" y2="142"/>
    <g class="mono">
      <line class="tick" x1="55" y1="131" x2="55" y2="153"/><text class="muted small" x="49" y="178">0</text>
      <line class="tick" x1="170" y1="131" x2="170" y2="153"/><text class="muted small" x="164" y="178">2</text>
      <line class="tick" x1="285" y1="131" x2="285" y2="153"/><text class="muted small" x="279" y="178">4</text>
      <line class="tick" x1="400" y1="131" x2="400" y2="153"/><text class="muted small" x="394" y="178">6</text>
      <line class="tick" x1="515" y1="131" x2="515" y2="153"/><text class="muted small" x="509" y="178">8</text>
      <line class="tick" x1="630" y1="131" x2="630" y2="153"/><text class="muted small" x="617" y="178">10</text>
      <line class="tick" x1="745" y1="131" x2="745" y2="153"/><text class="muted small" x="732" y="178">12</text>
      <line class="tick" x1="860" y1="131" x2="860" y2="153"/><text class="muted small" x="847" y="178">14</text>
      <line class="tick" x1="918" y1="131" x2="918" y2="153"/><text class="muted small" x="905" y="178">15</text>
    </g>

    <rect class="fail" x="45" y="205" width="280" height="43" rx="10"/>
    <text class="white small" x="72" y="233">0/2/4: PER 100%, FWTO</text>
    <rect class="warn" x="365" y="205" width="96" height="43" rx="10"/>
    <text class="white small" x="387" y="233">6: 문턱</text>
    <rect class="ok" x="485" y="205" width="85" height="43" rx="10"/>
    <text class="white small" x="507" y="233">8 안정</text>
    <rect class="ok" x="600" y="205" width="85" height="43" rx="10"/>
    <text class="white small" x="628" y="233">10</text>
    <rect class="accum" x="715" y="205" width="85" height="43" rx="10"/>
    <text class="ink small" x="744" y="233">12</text>
    <rect class="accum" x="830" y="205" width="85" height="43" rx="10"/>
    <text class="ink small" x="859" y="233">14</text>
    <rect class="warn" x="945" y="205" width="95" height="43" rx="10"/>
    <text class="white small" x="964" y="233">15 이상</text>
    <text class="muted tiny mono" x="45" y="278">실제 전단 여유(us) = 1.3 / 3.3 / 5.3 / 7.3 / 9.3 / 11.3 / 13.3 / 15.3 / 16.3</text>

    <text class="ink body" x="1090" y="130">관찰 해석</text>
    <text class="muted small" x="1090" y="166">0~4: PAC 부족 → FWTO</text>
    <text class="muted small" x="1090" y="199">6: SFD/FSL 탈락</text>
    <text class="muted small" x="1090" y="232">8~14: 안정 plateau 확인</text>
    <text class="muted small" x="1090" y="265">15: 이득 포화/환경 변동 가능</text>
  </g>

  <g transform="translate(70,1405)">
    <text class="ink body" x="0" y="0">PAC8은 preamble을 8 symbol 단위로 상관/탐색하는 acquisition 단위다. 32sym은 앞부분 손실에 민감하고, lead margin은 손실된 전단 관측 시간을 보상한다.</text>
    <text class="muted body" x="0" y="34">실패 카운터가 FWTO → SFDTO/FSL → 드문 PHE/FCE/FSL로 이동하면, 실패 지점이 acquisition 전단에서 뒤 단계로 넘어갔다는 근거가 된다.</text>
  </g>
</svg>
