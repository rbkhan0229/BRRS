<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { fill: #202933; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .muted { fill: #66778a; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
      .axis { stroke: #8a96a3; stroke-width: 2.5; }
      .tick { stroke: #8a96a3; stroke-width: 2.5; }
      .dash { stroke: #8a96a3; stroke-width: 2.5; stroke-dasharray: 10 10; }
      .thin { stroke: #c8d0d9; stroke-width: 2; }
      .wave { fill: #88bee9; }
      .sfd { fill: #2d7fd0; }
      .startup { fill: #f39aa3; }
      .listen { fill: #aeb7c0; }
      .pac { fill: #fac66d; }
      .accum { fill: #bee192; }
      .fail { fill: #d72f2f; }
      .ok { fill: #2f7d32; }
      .warn { fill: #b36b00; }
      .card { fill: #ffffff; stroke: #d8e0e8; stroke-width: 2.2; rx: 20; }
      .soft { fill: #eef3f8; stroke: #d5dee8; stroke-width: 2; rx: 16; }
      .outline { fill: none; stroke: #b36b00; stroke-width: 3.5; stroke-dasharray: 9 7; }
      .title { font-size: 48px; font-weight: 850; }
      .subtitle { font-size: 29px; font-weight: 500; }
      .section { font-size: 34px; font-weight: 850; }
      .label { font-size: 28px; font-weight: 800; }
      .body { font-size: 25px; }
      .small { font-size: 21px; }
      .tiny { font-size: 18px; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .white { fill: #ffffff; font-family: "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1600"/>

  <text class="ink title" x="90" y="78">Delayed-RX 실패 원인: PAC 관점 타이밍 해석</text>
  <text class="muted subtitle" x="90" y="124">현재 코드 기준: t=0은 실제 preamble 시작. 32sym 실제 preamble+SFD=40.7us, 코드 계산=42us → 실제 전단 여유 = lead + 1.3us</text>

  <g transform="translate(90,165)">
    <rect class="wave" x="0" y="0" width="36" height="30" rx="6"/>
    <text class="ink body" x="50" y="25">preamble</text>
    <rect class="sfd" x="210" y="0" width="36" height="30" rx="6"/>
    <text class="ink body" x="260" y="25">SFD</text>
    <rect class="startup" x="390" y="0" width="36" height="30" rx="6"/>
    <text class="ink body" x="440" y="25">RX 기동 지연 δ</text>
    <rect class="pac" x="690" y="0" width="36" height="30" rx="6"/>
    <text class="ink body" x="740" y="25">PAC8 상관 chunk</text>
    <rect class="accum" x="1015" y="0" width="36" height="30" rx="6"/>
    <text class="ink body" x="1065" y="25">누산(accumCount)</text>
  </g>

  <!-- axis -->
  <g>
    <line class="axis" x1="360" y1="260" x2="1530" y2="260"/>
    <line class="dash" x1="720" y1="238" x2="720" y2="1085"/>
    <text class="muted body" x="742" y="238">t=0: 실제 preamble 시작</text>
    <g class="mono">
      <line class="tick" x1="420" y1="247" x2="420" y2="273"/><text class="muted small" x="395" y="307">-30</text>
      <line class="tick" x1="520" y1="247" x2="520" y2="273"/><text class="muted small" x="495" y="307">-20</text>
      <line class="tick" x1="620" y1="247" x2="620" y2="273"/><text class="muted small" x="595" y="307">-10</text>
      <line class="tick" x1="720" y1="242" x2="720" y2="278"/><text class="ink small" x="713" y="307">0</text>
      <line class="tick" x1="820" y1="247" x2="820" y2="273"/><text class="muted small" x="800" y="307">+10</text>
      <line class="tick" x1="920" y1="247" x2="920" y2="273"/><text class="muted small" x="900" y="307">+20</text>
      <line class="tick" x1="1020" y1="247" x2="1020" y2="273"/><text class="muted small" x="1000" y="307">+30</text>
      <line class="tick" x1="1120" y1="247" x2="1120" y2="273"/><text class="muted small" x="1100" y="307">+40</text>
      <line class="tick" x1="1320" y1="247" x2="1320" y2="273"/><text class="muted small" x="1300" y="307">+60</text>
      <line class="tick" x1="1520" y1="247" x2="1520" y2="273"/><text class="muted small" x="1500" y="307">+80</text>
    </g>
  </g>

  <!-- main timeline cases -->
  <g transform="translate(90,350)">
    <text class="section ink" x="0" y="0">① 32sym, lead=0us</text>
    <text class="muted body" x="0" y="39">RX_ON 명령은 t=-1.3us. δ 후 실제 청취 시작 → preamble 관측량 부족</text>
    <text class="label ink" x="0" y="106">전파</text>
    <rect class="wave" x="630" y="76" width="326" height="54" rx="8"/>
    <rect class="sfd" x="956" y="76" width="82" height="54" rx="8"/>
    <text class="ink body" x="735" y="110">preamble 32sym</text>
    <text class="white body" x="980" y="110">SFD</text>
    <text class="label ink" x="0" y="184">수신기</text>
    <line class="thin" x1="617" y1="141" x2="617" y2="220"/>
    <text class="muted small mono" x="553" y="249">cmd -1.3</text>
    <rect class="startup" x="617" y="154" width="170" height="54" rx="8"/>
    <text class="ink body" x="696" y="189">δ</text>
    <rect class="pac" x="787" y="154" width="169" height="54" rx="8"/>
    <text class="ink body" x="813" y="189">관측 &lt; 21sym</text>
    <rect class="outline" x="956" y="154" width="72" height="54" rx="8"/>

    <rect class="card" x="1260" y="62" width="850" height="165"/>
    <text class="fail section" x="1290" y="105">✕ FWTO / PER 100%</text>
    <text class="ink body" x="1290" y="145">PAC 상관기가 충분한 preamble chunk를 채우지 못함</text>
    <text class="muted body" x="1290" y="183">프레임 시작까지 못 가는 실패라 tail margin 영향이 작음</text>
  </g>

  <g transform="translate(90,585)">
    <text class="section ink" x="0" y="0">② 32sym, lead≈6us: 문턱 구간</text>
    <text class="muted body" x="0" y="39">실제 전단 여유 ≈ 7.3us. preamble은 잡기 시작하지만 SFD 경계가 불안정</text>
    <text class="label ink" x="0" y="106">전파</text>
    <rect class="wave" x="630" y="76" width="326" height="54" rx="8"/>
    <rect class="sfd" x="956" y="76" width="82" height="54" rx="8"/>
    <text class="ink body" x="735" y="110">preamble 32sym</text>
    <text class="white body" x="980" y="110">SFD</text>
    <text class="label ink" x="0" y="184">수신기</text>
    <line class="thin" x1="557" y1="141" x2="557" y2="220"/>
    <text class="muted small mono" x="502" y="249">cmd -7.3</text>
    <rect class="startup" x="557" y="154" width="170" height="54" rx="8"/>
    <text class="ink body" x="636" y="189">δ</text>
    <rect class="pac" x="727" y="154" width="80" height="54" rx="7"/>
    <rect class="pac" x="807" y="154" width="80" height="54" rx="7"/>
    <rect class="pac" x="887" y="154" width="80" height="54" rx="7"/>
    <text class="ink small" x="741" y="188">PAC8</text>
    <text class="ink small" x="821" y="188">PAC8</text>
    <text class="ink small" x="901" y="188">PAC8</text>
    <rect class="outline" x="967" y="154" width="75" height="54" rx="8"/>

    <rect class="card" x="1260" y="62" width="850" height="165"/>
    <text class="warn section" x="1290" y="105">△ SFDTO/FSL 중심</text>
    <text class="ink body" x="1290" y="145">acquisition은 시작되지만 SFD 탐색 여유가 작음</text>
    <text class="muted body" x="1290" y="183">실험: lead 6us, PER 4.0%, sfdto 34 / fsl 6</text>
  </g>

  <g transform="translate(90,820)">
    <text class="section ink" x="0" y="0">③ 32sym, lead=20us</text>
    <text class="muted body" x="0" y="39">실제 전단 여유 ≈ 21.3us. δ가 끝난 뒤에도 preamble 관측 구간이 충분</text>
    <text class="label ink" x="0" y="106">전파</text>
    <rect class="wave" x="630" y="76" width="326" height="54" rx="8"/>
    <rect class="sfd" x="956" y="76" width="82" height="54" rx="8"/>
    <text class="ink body" x="735" y="110">preamble 32sym</text>
    <text class="white body" x="980" y="110">SFD</text>
    <text class="label ink" x="0" y="184">수신기</text>
    <line class="thin" x1="417" y1="141" x2="417" y2="220"/>
    <text class="muted small mono" x="360" y="249">cmd -21.3</text>
    <rect class="startup" x="417" y="154" width="170" height="54" rx="8"/>
    <text class="ink body" x="496" y="189">δ</text>
    <rect class="listen" x="587" y="154" width="43" height="54" rx="8"/>
    <text class="muted tiny" x="593" y="187">대기</text>
    <rect class="pac" x="630" y="154" width="80" height="54" rx="7"/>
    <rect class="pac" x="710" y="154" width="80" height="54" rx="7"/>
    <rect class="pac" x="790" y="154" width="80" height="54" rx="7"/>
    <text class="ink small" x="644" y="188">PAC8</text>
    <text class="ink small" x="724" y="188">PAC8</text>
    <text class="ink small" x="804" y="188">PAC8</text>
    <rect class="accum" x="870" y="154" width="86" height="54" rx="8"/>
    <text class="ink body" x="886" y="189">누산</text>

    <rect class="card" x="1260" y="62" width="850" height="165"/>
    <text class="ok section" x="1290" y="105">✓ 안정 성공 영역</text>
    <text class="ink body" x="1290" y="145">기동 지연이 preamble 도착 전에 대부분 흡수됨</text>
    <text class="muted body" x="1290" y="183">lead는 TX airtime을 늘리지 않는 RX-side guard</text>
  </g>

  <!-- sweep panel -->
  <g transform="translate(90,1110)">
    <rect class="soft" x="0" y="0" width="2220" height="350"/>
    <text class="section ink" x="30" y="55">Lead sweep 확대: lead 10/12/14/15 포함</text>
    <text class="muted body" x="30" y="92">32sym 현재 코드 기준 실제 전단 여유 = lead + 1.3us. 색은 실패 단계 변화를 의미함.</text>

    <!-- mini axis -->
    <line class="axis" x1="60" y1="150" x2="1330" y2="150"/>
    <g class="mono">
      <line class="tick" x1="60" y1="137" x2="60" y2="163"/><text class="muted small" x="51" y="195">0</text>
      <line class="tick" x1="220" y1="137" x2="220" y2="163"/><text class="muted small" x="211" y="195">2</text>
      <line class="tick" x1="380" y1="137" x2="380" y2="163"/><text class="muted small" x="371" y="195">4</text>
      <line class="tick" x1="540" y1="137" x2="540" y2="163"/><text class="muted small" x="531" y="195">6</text>
      <line class="tick" x1="700" y1="137" x2="700" y2="163"/><text class="muted small" x="691" y="195">8</text>
      <line class="tick" x1="860" y1="137" x2="860" y2="163"/><text class="muted small" x="845" y="195">10</text>
      <line class="tick" x1="1020" y1="137" x2="1020" y2="163"/><text class="muted small" x="1005" y="195">12</text>
      <line class="tick" x1="1180" y1="137" x2="1180" y2="163"/><text class="muted small" x="1165" y="195">14</text>
      <line class="tick" x1="1260" y1="137" x2="1260" y2="163"/><text class="muted small" x="1245" y="195">15</text>
    </g>

    <!-- status blocks -->
    <rect class="fail" x="40" y="215" width="360" height="48" rx="12"/>
    <text class="white small" x="70" y="247">0/2/4: PER 100%, FWTO</text>
    <rect class="warn" x="500" y="215" width="120" height="48" rx="12"/>
    <text class="white small" x="525" y="247">6: 문턱</text>
    <rect class="ok" x="670" y="215" width="120" height="48" rx="12"/>
    <text class="white small" x="700" y="247">8: 안정</text>
    <rect class="ok" x="830" y="215" width="120" height="48" rx="12"/>
    <text class="white small" x="855" y="247">10</text>
    <rect class="accum" x="990" y="215" width="120" height="48" rx="12"/>
    <text class="ink small" x="1016" y="247">12</text>
    <rect class="accum" x="1150" y="215" width="120" height="48" rx="12"/>
    <text class="ink small" x="1176" y="247">14</text>
    <rect class="warn" x="1310" y="215" width="120" height="48" rx="12"/>
    <text class="white small" x="1333" y="247">15: 이상</text>

    <text class="muted tiny mono" x="50" y="292">실제 전단 여유(us): 1.3 / 3.3 / 5.3 / 7.3 / 9.3 / 11.3 / 13.3 / 15.3 / 16.3</text>

    <!-- explanation table -->
    <text class="ink body" x="1480" y="132">관찰 해석</text>
    <text class="muted small" x="1480" y="172">0~4us: PAC chunk 부족 → FWTO</text>
    <text class="muted small" x="1480" y="207">6us: preamble은 잡히나 SFD/FSL 탈락</text>
    <text class="muted small" x="1480" y="242">8~14us: 안정권 확인 구간</text>
    <text class="muted small" x="1480" y="277">15us: 추가 lead 이득 포화, 오검출/환경 변동 가능</text>
    <text class="muted small" x="1480" y="312">12/14는 실측값을 넣어 안정 plateau를 확인하면 좋음</text>
  </g>

  <g transform="translate(90,1495)">
    <text class="ink body" x="0" y="0">PAC8은 preamble을 8 symbol 단위로 상관/탐색하는 acquisition 단위다. 32sym은 앞부분 손실에 민감하고, lead margin은 손실된 전단 관측 시간을 보상한다.</text>
    <text class="muted body" x="0" y="38">실패 카운터가 FWTO → SFDTO/FSL → PHE/FCE/FSL의 드문 오류로 이동하면, 실패 지점이 acquisition 전단에서 뒤 단계로 넘어갔다는 근거가 된다.</text>
  </g>
</svg>
